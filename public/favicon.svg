<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#DE1D77" />
      <stop offset="100%" stop-color="#970747" />
    </linearGradient>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with dark berry tone -->
  <rect width="64" height="64" rx="16" fill="#0B0307" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#970747" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Car body in crisp white -->
  <path d="M12 36 L20 25 C21.5 23 24 22 27 22 L37 22 C40 22 42.5 23 44 25 L52 36 C54 36.5 55 38 55 40 L55 43 C55 44 54 45 53 45 L50 45 C50 48.5 47 51 43.5 51 C40 51 37.5 48.5 37.5 45 L26.5 45 C26.5 48.5 24 51 20.5 51 C17 51 14.5 48.5 14.5 45 L11 45 C10 45 9 44 9 43 L9 40 C9 38 10 36.5 12 36 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Wheels with dark pink rims -->
  <circle cx="20.5" cy="45" r="4" fill="#0B0307" stroke="#970747" stroke-width="2.5" />
  <circle cx="43.5" cy="45" r="4" fill="#0B0307" stroke="#970747" stroke-width="2.5" />
  <circle cx="20.5" cy="45" r="1.5" fill="#FFFFFF" />
  <circle cx="43.5" cy="45" r="1.5" fill="#FFFFFF" />

  <!-- Windshield line -->
  <path d="M22 25 L32 25 L32 34 L15 34" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M35 25 L42 25 L48 34 L35 34 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Electric Bolt in dark pink & white glow -->
  <path d="M34 11 L25 24 L32 24 L29 35 L40 21 L33 21 Z" 
        fill="url(#pinkGrad)" filter="url(#pinkGlow)" />
</svg>
